<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <main class="main">
        <header class="header">
            <h1 class="title">Inventory</h1>
            <button class="btn" id="addProduct">
                <img src="./assets/icons/plus-solid.png" alt="Plus icon" class="icon">
                <span>Add Product</span>
            </button>
        </header>
        <section class="container">
            <div class="card card-resume">
                <div class="card-content">
                    <p class="description">Total Asset Value</p>
                    <span class="amount" id="total">$0.00</span>
                </div>
                <div class="card-content">
                    <div class="total-products flex-row">
                        <span class="amount" id="totalProducts">0</span>
                        <p class="description">Products</p>
                    </div>
                    <div class="progress-products flex-row">
                        <div class="progress-product product--in-stock" id="inStockProgress"></div>
                        <div class="progress-product product--low-stock" id="lowStockProgress"></div>
                        <div class="progress-product product--out-stock" id="outStockProgress"></div>
                    </div>
                    <div class="statistic-list flex-row">
                        <div class="statistic">
                            <div class="progress-reference product--in-stock"></div>
                            <p class="description">In stock:</p>
                            <span class="amount" id="productInStock">000</span>
                        </div>
                        <div class="statistic">
                            <div class="progress-reference product--low-stock"></div>
                            <p class="description">Low stock:</p>
                            <span class="amount" id="productLowStock">000</span>
                        </div>
                        <div class="statistic">
                            <div class="progress-reference product--out-stock"></div>
                            <p class="description">Out of stock:</p>
                            <span class="amount" id="productOutStock">000</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="container card product-list">
            <div class="filters">
                <div class="searchbar">
                    <input class="form-control searchbar-input" type="text" name="searchbar" id="searchbar"
                        placeholder="Search">
                    <button type="button" class="searchbar-btn" aria-label="Search">
                        <img src="./assets/icons/magnifying-glass-solid.png" alt="Search icon" class="icon">
                    </button>
                </div>
                <div class="inputs filter-group">
                    <select class="form-control form-select" name="status" id="status" class="input">
                        <option value="" disabled selected>Status</option>
                        <option value="all">All</option>
                        <option value="inStock">In stock</option>
                        <option value="lowStock">Low stock</option>
                        <option value="outStock">Out of stock</option>
                    </select>
                </div>
            </div>
            <div class="product-table">
                <table>
                    <thead class="table-heading">
                        <tr>
                            <th class="table-col">Product Name</th>
                            <th class="table-col">Category</th>
                            <th class="table-col">SKU</th>
                            <th class="table-col">Stock</th>
                            <th class="table-col">Status</th>
                            <th class="table-col">Price</th>
                            <th class="table-col txt-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="table-body">
                        <tr class="table-empty table-empty--hidden">
                            <td colspan="7">No data available</td>
                        </tr>
                        <tr class="product-row">
                            <td class="cell">Test</td>
                            <td class="cell">Test</td>
                            <td class="cell">Test</td>
                            <td class="cell">Test</td>
                            <td class="cell cell--status">
                                <span class="status-badge status-badge--in-stock">In stock</span>
                            </td>
                            <td class="cell">Test</td>
                            <td class="cell txt-center">
                                <div class="dropdown-container">
                                    <button type="button" class="dropdown-toggle" aria-label="Open actions">⋯</button>
                                    <div class="dropdown dropdown--hidden">
                                        <button type="button" class="dropdown-item">Edit</button>
                                        <button type="button"
                                            class="dropdown-item dropdown-item--danger">Delete</button>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-heading">
                <h2 class="title">Add Product</h2>
                <button type="button" id="closeModal">
                    <img src="./assets/icons/xmark-solid.png" alt="X mark icon" class="icon">
                </button>
            </div>
            <form class="formProduct">
                <div claform-group">
                    <label for="product">Product name</label>
                    <input class="input" type="text" name="product" id="product">
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select class="form-select" name="category" id="category">
                        <option value="" disabled selected>Select a category</option>
                        <option value="electronics">Electronics</option>
                        <option value="clothesAndFootweart">Clothing and Footwear</option>
                        <option value="homeAndDecor">Home and Decor</option>
                        <option value="personal">Personal Care</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="units">Number of units</label>
                    <input class="input" type="number" name="units" id="units">
                </div>
                <div class="form-group">
                    <label for="price">Price</label>
                    <input class="input" type="number" name="price" id="price">
                </div>
                <button type="submit" class="btn btn-add">Add product</button>
            </form>
        </div>
    </div>
</body>

</html>
